{{ define "pages/login.html" }} {{ $submit := "Sign in"}}
<div class="mx-auto max-w-sm space-y-6 auth-container">
  <h1 class="text-2xl font-bold tracking-tight">Sign in</h1>
  {{ template "partials/auth_form.html" dict "Action" "/login" "Submit" $submit
  "View" . }}
  <p class="text-sm text-text-muted">
    No account?
    <a href="/register" class="text-text hover:underline">Create one</a>.
  </p>
  <p class="text-sm text-text-muted">
    <a href="/forgot-password" class="text-text hover:underline">Forgot your password?</a>
  </p>
</div>
{{ end }}
