{{ define "pages/builder.html" }}
<div class="space-y-6">
    <section class="flex flex-wrap items-start justify-between gap-4">
        <form
            class="flex-1 space-y-2"
            hx-post="/r/{{ .Ranking.Slug }}"
            hx-target="#ranking-meta"
            hx-swap="outerHTML"
        >
            {{ template "partials/ranking_meta.html" . }}
        </form>

        <div class="flex items-center gap-3">
            {{ if .IsDraft }}
            <span class="text-xs uppercase tracking-wide text-slate-500"
                >Unsaved draft</span
            >
            {{ else }}
            <span class="text-xs uppercase tracking-wide text-emerald-400"
                >Saved</span
            >
            {{ end }}
            <form method="post" action="/r/{{ .Ranking.Slug }}/save">
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ .CSRFToken }}"
                />
                <button
                    class="rounded-md bg-amber-400 px-4 py-2 text-sm font-semibold text-slate-900 hover:bg-amber-300"
                >
                    Save ranking
                </button>
            </form>
        </div>
    </section>

    <div id="board">{{ template "partials/board.html" . }}</div>
</div>
{{ end }}
