{{ define "pages/me.html" }}
<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold tracking-tight">Your rankings</h1>
    <form hx-post="/new">
      <button
        class="rounded-md bg-primary hover:bg-primary-hover px-4 py-2 text-sm font-semibold text-background"
      >
        New ranking
      </button>
    </form>
  </div>

  <ul
    class="divide-y divide-border rounded-lg border border-border cursor-pointer"
  >
    {{ range .Rankings }}
    <li class="px-4 py-3 bg-surface hover:bg-surface-hover">
      <a
        href="/r/{{ .Uuid }}"
        class="flex items-center justify-between font-medium text-text hover:text-text-hover"
      >
        <div>
          <p>{{ .Name }}</p>
          {{ if .Description }}
          <p class="text-sm text-text-muted">{{ .Description }}</p>
          {{ end }}
        </div>
        <span class="text-xs text-text-subtle"
          >updated {{ .FormattedUpdated }}</span
        ></a
      >
    </li>
    {{ else }}
    <li class="px-4 py-6 text-sm text-slate-400">
      Nothing saved yet —
      <a href="/" class="text-amber-300 hover:underline">start a ranking</a>.
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
