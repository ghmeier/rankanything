{{ define "pages/me.html" }}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold tracking-tight">Your rankings</h1>
        <a
            href="/new"
            class="rounded-md bg-amber-400 px-4 py-2 text-sm font-semibold text-slate-900 hover:bg-amber-300"
            >New ranking</a
        >
    </div>

    <ul class="divide-y divide-slate-800 rounded-lg border border-slate-800">
        {{ range .Rankings }}
        <li class="flex items-center justify-between px-4 py-3">
            <div>
                <a
                    href="/r/{{ .Slug }}"
                    class="font-medium text-slate-100 hover:text-amber-300"
                    >{{ .Title }}</a
                >
                {{ if .Description }}
                <p class="text-sm text-slate-400">{{ .Description }}</p>
                {{ end }}
            </div>
            <span class="text-xs text-slate-500"
                >updated {{ .FormattedUpdated }}</span
            >
        </li>
        {{ else }}
        <li class="px-4 py-6 text-sm text-slate-400">
            Nothing saved yet —
            <a href="/" class="text-amber-300 hover:underline"
                >start a ranking</a
            >.
        </li>
        {{ end }}
    </ul>
</div>
{{ end }}
