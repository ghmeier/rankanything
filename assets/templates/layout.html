{{ define "layout.html" }}<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rank Anything</title>
    <meta
      name="description"
      content="Drag anything into tiers. Start ranking instantly, sign in only when you want to keep it."
    />
    <link rel="stylesheet" href="/static/css/app.css" />
    <script src="/static/js/htmx.min.js"></script>
  </head>
  <body
    class="min-h-full bg-background text-text antialiased"
    hx-headers='{"X-CSRF-Token": "{{ with .Data }}{{ .CSRFToken }}{{ end }}"}'
  >
    <header class="border-b border-border">
      <div
        class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4"
      >
        <a href="/" class="text-lg font-semibold tracking-tight"
          ><span class="text-text-muted">rank</span>anything</a
        >
        <nav class="flex items-center gap-4 text-sm">
          {{ with .Data }} {{ if .User }}
          <a href="/me" class="text-text-muted hover:text-text-muted-hover"
            >Your rankings</a
          >
          <button
            class="text-text-muted hover:text-text-muted-hover"
            hx-post="/logout"
          >
            Sign out
          </button>

          {{ else }}
          <a href="/login" class="text-text-muted hover:text-text-muted-hover"
            >Sign in</a
          >
          <a
            href="/register"
            class="rounded-md bg-primary hover:bg-primary-hover text-background px-3 py-1.5 font-medium"
            >Create account</a
          >
          {{ end }} {{ end }}
        </nav>
      </div>
    </header>

    {{ with .Data }}{{ template "partials/flash.html" .Flash }}{{ end }}

    <main class="mx-auto max-w-6xl px-6 py-4">
      {{ renderDynamic .Page .Data }}
    </main>
  </body>
</html>
{{ end }}
