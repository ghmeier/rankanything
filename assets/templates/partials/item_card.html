{{ define "partials/item_card.html" }} {{ $slug := .RankingSlug }} {{ $item :=
.Item }}
<article
  class="group flex w-40 items-center gap-2 rounded-md h-fit border border-border bg-surface p-2 text-sm shadow-sm"
  id="ranking-item-{{ $item.ID }}"
>
  {{ if $item.ImageUrl }}
  <img
    src="{{ $item.ImageUrl }}"
    alt="{{ $item.Label }}"
    loading="lazy"
    class="h-10 w-10 rounded object-cover"
  />
  {{ end }}
  <div class="min-w-0 flex-1">
    <p class="truncate font-medium text-text">{{ $item.Label }}</p>
    {{ if $item.Sublabel }}
    <p class="truncate text-xs text-text-muted">{{ $item.Sublabel }}</p>
    {{ end }}
  </div>
  <button
    hx-delete="/r/{{ $slug }}/items/{{ $item.ID }}"
    hx-target="#ranking-item-{{ $item.ID }}"
    hx-swap="outerHTML"
    aria-label="Remove {{ $item.Label }}"
    class="opacity-0 transition group-hover:opacity-100 text-slate-500 hover:text-rose-400"
  >
    &times;
  </button>
</article>
{{ end }}
