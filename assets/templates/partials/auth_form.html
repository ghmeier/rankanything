{{ define "partials/auth_form.html" }} {{ $view := .View }}
<script>
  document.addEventListener("htmx:beforeSwap", (event) => {
    if (event.detail.xhr.status === 401) {
      event.detail.shouldSwap = true;
      event.detail.isError = false;
    }
  });
</script>
<form
  hx-post="{{ .Action }}"
  class="space-y-4"
  hx-target="closest .auth-container"
  hx-swap="outerHTML"
>
  <input type="hidden" name="next" value="{{ $view.Next }}" />
  {{ if $view.EmailAlreadyRegistered }}
  <p role="alert" class="rounded-md border border-danger bg-danger-surface px-3 py-2 text-sm text-danger">
    This email is already registered.
    <a href="/login" class="underline">Try logging in</a> or
    <a href="/forgot-password" class="underline">reset your password</a>.
  </p>
  {{ else if $view.Error }}
  <p role="alert" class="rounded-md border border-danger bg-danger-surface px-3 py-2 text-sm text-danger">
    {{ $view.Error }}
  </p>
  {{ end }}

  <label class="block space-y-1">
    <span class="text-xs uppercase tracking-wide text-muted">Email</span>
    <input
      type="email"
      name="email"
      required
      autocomplete="email"
      value="{{ $view.Email }}"
      class="w-full rounded-md border border-border bg-surface focus:bg-surface-hover px-3 py-2 text-sm outline-none"
    />
  </label>

  <label class="block space-y-1">
    <span class="text-xs uppercase tracking-wide text-muted">Password</span>
    <input
      type="password"
      name="password"
      required
      minlength="8"
      autocomplete="current-password"
      class="w-full rounded-md border border-border bg-surface focus:bg-surface-hover px-3 py-2 text-sm outline-none"
    />
  </label>

  <button
    class="w-full rounded-md bg-primary hover:bg-primary-hover px-4 py-2 text-sm font-semibold text-background"
    type="submit"
  >
    {{ .Submit }}
  </button>
</form>
{{ end }}
