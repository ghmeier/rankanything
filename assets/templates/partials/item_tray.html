{{ define "partials/item_tray.html" }}
<section
  class="rounded-lg border border-dashed border-slate-700 bg-slate-900/40 p-4"
>
  <div class="mb-3 flex items-center justify-between">
    <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-400">
      Unranked items
    </h2>
    <form
      class="flex gap-2"
      hx-post="/r/{{ .RankingSlug }}/items"
      hx-target="#tray-items"
      hx-swap="beforeend"
      hx-on::after-request="this.reset()"
    >
      <input
        name="label"
        required
        placeholder="Add an item"
        aria-label="Item label"
        class="rounded-md border border-slate-700 bg-slate-900 px-3 py-1.5 text-sm outline-none focus:border-amber-400"
      />
      <input
        name="image_url"
        placeholder="Image URL (optional)"
        aria-label="Item image URL"
        class="w-48 rounded-md border border-slate-700 bg-slate-900 px-3 py-1.5 text-sm outline-none focus:border-amber-400"
      />
      <button
        class="rounded-md border border-amber-400 px-3 py-1.5 text-sm font-medium text-amber-300 hover:bg-amber-400/10"
      >
        Add
      </button>
    </form>
  </div>
  <div id="tray-items" class="flex min-h-20 flex-wrap gap-2 sortable">
    {{ range .Unassigned }} {{ template "partials/item_card.html" dict "Item" .
    "RankingSlug" $.RankingSlug }} {{ end }}
  </div>
</section>
{{ end }}
