{{ define "partials/item_tray.html" }}
<section
  class="rounded-lg border border-dashed border-border bg-surface-muted p-4"
>
  <div class="mb-3 flex items-center justify-between">
    <h2 class="text-sm font-semibold uppercase tracking-wide text-text-muted">
      Unranked items
    </h2>
    <form
      class="flex gap-2"
      hx-post="/r/{{ .RankingUUID }}/items"
      hx-target="#tray-items"
      hx-swap="beforeend"
      hx-on::after-request="this.reset()"
    >
      <input
        name="label"
        required
        placeholder="Add an item"
        aria-label="Item label"
        class="rounded-md border border-border bg-surface focus:bg-surface-hover px-3 py-1.5 text-sm outline-none"
      />
      <input
        name="image_url"
        placeholder="Image URL (optional)"
        aria-label="Item image URL"
        class="w-48 rounded-md border border-border bg-surface focus:bg-surface-hover px-3 py-1.5 text-sm outline-none"
      />
      <button
        class="rounded-md border border-border bg-secondary hover:bg-secondary-hover px-3 py-1.5 text-sm text-background"
      >
        Add
      </button>
    </form>
  </div>
  <div id="tray-items" class="flex min-h-20 flex-wrap gap-2">
    {{ range .Unassigned }} {{ template "partials/item_card.html" dict "Item" .
    "RankingUUID" $.RankingUUID }} {{ end }}
  </div>
</section>
{{ end }}
