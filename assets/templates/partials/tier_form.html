{{ define "partials/tier_form.html" }}
<form
  class="flex gap-2"
  hx-post="/r/{{ .Ranking.Uuid }}/tiers"
  hx-target="#tier-rows"
  hx-swap="beforeend"
  hx-on::after-request="this.reset()"
>
  <input
    name="label"
    required
    placeholder="New tier label"
    aria-label="New tier label"
    class="rounded-sm border border-border bg-surface focus:bg-surface-hover px-3 py-1.5 text-sm outline-none"
  />
  <input
    type="color"
    name="color"
    value="#94a3b8"
    aria-label="New tier color"
    class="h-9 w-12 rounded bg-transparent"
  />
  <button
    class="rounded-md border border-border bg-secondary hover:bg-secondary-hover px-3 py-1.5 text-sm text-background"
  >
    Add tier
  </button>
</form>
{{ end }}
