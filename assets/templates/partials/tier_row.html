{{ define "partials/tier_row.html" }} {{ $tier := .Tier }}
<section class="flex items-stretch gap-2 bg-surface">
  {{ template "partials/tier_row_label.html" dict "Tier" $tier "RankingSlug"
  .RankingSlug }}
  <div
    id="tier-items-{{ $tier.ID }}"
    class="flex min-h-24 flex-1 flex-wrap content-start gap-2 p-3"
  >
    {{ range .Items }} {{ template "partials/item_card.html" dict "Item" .
    "RankingSlug" $.RankingSlug }} {{ end }}
  </div>
</section>
{{ end }}
