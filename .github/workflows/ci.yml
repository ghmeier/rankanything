name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: make css

      - name: Generate templ files
        run: make templ

      - name: Fail on generated-file drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files differ from their checked-in source. If a *_templ.go file is tracked, it's stale — run 'go tool templ generate' locally and commit the result:"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

  # The image is built differently than a local `make build` is: the CSS is
  # compiled from a narrower file tree, and the binary is statically linked
  # for distroless. Building it here is what catches that divergence, since
  # nothing else in CI exercises the Dockerfile.
  image:
    name: Build container image
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rankanything:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A stylesheet missing a class is a silent, production-only failure:
      # everything renders, just unstyled in one spot. board.js applies
      # opacity-50 at drag time and no templ component mentions it, so it
      # only reaches the CSS because input.css names the js directory as a
      # source. Assert on it directly rather than trusting that.
      - name: Check the embedded stylesheet is complete
        run: |
          container_id="$(docker create rankanything:ci)"
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/rankanything" /tmp/rankanything
          if ! strings /tmp/rankanything | grep -q '\.opacity-50'; then
            echo "The embedded app.css has no bare .opacity-50 rule."
            echo "board.js adds that class while dragging, so the drag ghost would be invisible in production."
            echo "Check the @source directives in assets/static/css/input.css and the COPY lines in the Dockerfile's css stage."
            exit 1
          fi
          echo "Embedded stylesheet carries the classes board.js applies at runtime."

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          only-new-issues: true
